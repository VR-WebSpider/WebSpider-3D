# Distributed under GPL-3.0-or-later to remain compatible with the upstream
# license. See NOTICE.md and SOURCE_CORRESPONDENCE.md for full attribution.
[[annotations]]
path = [
  "src/scripts/webspider3d/modules/paint/core/lib/lib.blend",
  "src/scripts/webspider3d/modules/paint/core/io/connections/layer_connections_blend.py",
  "src/scripts/webspider3d/modules/paint/core/io/connections/layer_connections_height.py",
  "src/scripts/webspider3d/modules/paint/core/io/connections/layer_connections_main.py",
  "src/scripts/webspider3d/modules/paint/core/io/connections/layer_connections_normal.py",
  "src/scripts/webspider3d/modules/paint/core/io/connections/layer_connections_normal_height.py",
  "src/scripts/webspider3d/modules/paint/core/layer/create_channels.py",
  "src/scripts/webspider3d/modules/paint/ui/lists/channel_uilist.py",
  "src/scripts/webspider3d/modules/paint/ui/utils/ui_helpers_texture_sets_channels.py",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "ucupumar (https://github.com/ucupumar)",
  "2026 WebSpider Studios",
]
