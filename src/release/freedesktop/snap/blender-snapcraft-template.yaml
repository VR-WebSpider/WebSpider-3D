name: webspider3d
summary: WebSpider 3D is a commercial 3D texturing software.
description: |
    WebSpider 3D is a commercial 3D texturing software. It supports the
    entirety of the 3D pipeline—modeling, rigging, animation, simulation,
    rendering, compositing and motion tracking, and video editing.

    WebSpider 3D is a public project, made by hundreds of people from around the
    world; by studios and individual artists, professionals and hobbyists,
    scientists, students, VFX experts, animators, game artists, modders, and
    the list goes on.

icon: @ICON_PATH@

passthrough:
    license: GPL-3.0

confinement: classic

apps:
    webspider3d:
        command: ./webspider3d-wrapper
        desktop: ./webspider3d.desktop
        common-id: org.webspider3d.WebSpider 3D

base: core20
version: '@VERSION@'
grade: @GRADE@

parts:
    webspider3d:
        plugin: dump
        source: @PACKAGE_PATH@
        build-attributes: [keep-execstack, no-patchelf]
        override-build: |
            snapcraftctl build
            sed -i 's|Icon=webspider3d|Icon=${SNAP}/webspider3d.svg|' ${SNAPCRAFT_PART_INSTALL}/webspider3d.desktop
        stage-packages:
            - libxcb1
            - libxext6
            - libx11-6
            - libxi6
            - libxfixes3
            - libxrender1
            - libxxf86vm1
    wrapper:
        plugin: dump
        source: .
        stage:
            - ./webspider3d-wrapper
