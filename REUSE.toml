version = 1

[[annotations]]
path = [
  ".env.example",
  ".gitignore",
  ".gitmodules",
  ".publicignore",
  ".serena/.gitignore",
  "Makefile",
  "VERSION",
  "scripts/windows/codesign-tools/.gitignore",
  "scripts/windows/codesign-tools/metadata.json",
  "src/build_files/windows/*.cmd",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 WebSpider Studios"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = "src/release/**"
precedence = "closest"
SPDX-FileCopyrightText = "Open-source contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = [
  "src/scripts/webspider3d/modules/onboarding/assets/**",
  "src/scripts/webspider3d/modules/paint/procedural_materials/**/*.json",
  "src/scripts/webspider3d/modules/paint/procedural_materials/**/*.png",
  "src/scripts/webspider3d/modules/testing/*.json",
  "src/scripts/webspider3d/modules/texel_density/texel/*.json",
  "src/scripts/startup/bl_app_templates_system/**/*.blend",
]
precedence = "closest"
SPDX-FileCopyrightText = "Open-source contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"

